<div class="shell">
  <header class="topbar-wrap">
    <div class="topbar">
      <a class="brand" routerLink="/goals">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z" />
            <path d="M12 12l8-4.5M12 12v9M12 12L4 7.5" />
          </svg>
        </span>
        <span class="brand-copy">
          <strong>{{ 'app.brand' | t }}</strong>
          <small>{{ 'app.tagline' | t }}</small>
        </span>
      </a>

      <nav class="nav-pills" aria-label="Primary navigation">
        @for (item of navItems; track item.route) {
          <a
            class="nav-pill"
            [routerLink]="item.route"
            routerLinkActive="is-active"
          >
            <span>{{ item.labelKey | t }}</span>
            @if (item.soon) {
              <span class="pill-soon">{{ 'nav.soon' | t }}</span>
            }
          </a>
        }
      </nav>

      <div class="utilities">
        <button
          type="button"
          class="status-chip"
          [class.is-ok]="statusOk()"
          (click)="refreshHealth()"
          [title]="statusText()"
        >
          <span class="dot"></span>
          <span class="status-label">{{ statusText() }}</span>
        </button>

        <div class="lang-switch" role="group" aria-label="Language switcher">
          <button
            type="button"
            class="lang-btn"
            [class.is-active]="i18n.lang() === 'es'"
            (click)="switchLang('es')"
          >
            ES
          </button>
          <button
            type="button"
            class="lang-btn"
            [class.is-active]="i18n.lang() === 'en'"
            (click)="switchLang('en')"
          >
            EN
          </button>
        </div>

        <button
          type="button"
          class="theme-btn"
          (click)="themeService.toggle()"
          [title]="
            (themeService.theme() === 'light'
              ? 'app.switchToDark'
              : 'app.switchToLight') | t
          "
        >
          @if (themeService.theme() === 'light') {
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z" />
            </svg>
            <span>{{ 'app.themeDark' | t }}</span>
          } @else {
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
            </svg>
            <span>{{ 'app.themeLight' | t }}</span>
          }
        </button>
      </div>
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
