services:
  mongo:
    image: mongo:7
    container_name: life-os-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - life_os_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: life-os-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: ${DOCKER_MONGODB_URI:-mongodb://mongo:27017/life-os}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost:4200,https://localhost,capacitor://localhost}
      JWT_SECRET: ${JWT_SECRET:-life_os_dev_secret_key_2026_super_secure}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: life-os-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  life_os_mongo_data:

